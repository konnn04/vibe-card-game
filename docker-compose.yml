services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: uno-gateway:latest
    container_name: uno-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_CLIENT_URL: http://client:3002
      INTERNAL_SERVER_URL: http://server:3001
    expose:
      - "3000"
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: uno-server:latest
    container_name: uno-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVER_PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
    image: uno-client:latest
    container_name: uno-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_SERVER_URL: http://server:3001
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
    expose:
      - "3002"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
