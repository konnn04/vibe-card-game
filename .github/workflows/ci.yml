name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Một PR đẩy nhiều commit liên tiếp thì chỉ giữ lần chạy mới nhất.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — scripts/gen-version.mjs đếm commit làm số patch;
      # clone nông mặc định chỉ có 1 commit nên mọi bản CI đều ra v0.1.1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # build cũng chạy prebuild -> sinh lại manifest âm thanh/nhạc, nên bước
      # này đồng thời kiểm luôn là hai script đó không hỏng.
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      # fetch-depth: 0 — scripts/gen-version.mjs đếm commit làm số patch;
      # clone nông mặc định chỉ có 1 commit nên mọi bản CI đều ra v0.1.1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # webServer trong playwright.config.ts tự build + start, không cần bước riêng.
      - run: pnpm test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
